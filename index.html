<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <title>NDRT 算术判断任务</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f6f8;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 18px;
      padding-top: calc(18px + env(safe-area-inset-top));
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      display: table;
    }

    .page-inner {
      display: table-cell;
      vertical-align: middle;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.6;
      color: #666;
    }

    .timer-wrap {
      width: 100%;
      height: 10px;
      background: #edf0f2;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #222;
    }

    .question-box {
      background: #f7f8fa;
      border: 2px solid #e5e8eb;
      border-radius: 26px;
      padding: 42px 16px;
      margin-bottom: 18px;
      min-height: 180px;
      display: table;
      width: 100%;
    }

    .question-inner {
      display: table-cell;
      vertical-align: middle;
    }

    .question {
      font-size: 74px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .status-row {
      width: 100%;
      display: table;
      table-layout: fixed;
      border-spacing: 10px;
      margin: 0 0 14px 0;
    }

    .stat-card {
      display: table-cell;
      background: #f7f8fa;
      border-radius: 16px;
      padding: 13px 8px;
      vertical-align: middle;
    }

    .stat-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
    }

    .hint {
      min-height: 24px;
      margin: 0 0 18px;
      color: #777;
      font-size: 16px;
      line-height: 1.5;
    }

    .answer-row {
      width: 100%;
      display: table;
      table-layout: fixed;
      border-spacing: 10px;
      margin: 0 0 18px 0;
    }

    .answer-cell {
      display: table-cell;
    }

    .control-row {
      width: 100%;
      display: table;
      table-layout: fixed;
      border-spacing: 8px;
      margin: 0;
    }

    .control-cell {
      display: table-cell;
    }

    button {
      width: 100%;
      min-height: 64px;
      border: 0;
      border-radius: 18px;
      padding: 16px 12px;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    button:active {
      opacity: 0.82;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-true {
      background: #1f7a4d;
      color: #fff;
    }

    .btn-false {
      background: #a93434;
      color: #fff;
    }

    .btn-start {
      background: #222;
      color: #fff;
    }

    .btn-end,
    .btn-reset {
      background: #e9ecef;
      color: #222;
    }

    .footer-note {
      margin: 14px 0 0;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    @media screen and (max-width: 700px) {
      .page {
        padding: 10px;
      }

      .app {
        padding: 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 13px;
      }

      .question-box {
        min-height: 145px;
        padding: 30px 10px;
      }

      .question {
        font-size: 48px;
        white-space: normal;
      }

      .status-row,
      .answer-row,
      .control-row {
        display: block;
        border-spacing: 0;
      }

      .stat-card {
        display: inline-block;
        width: 48%;
        margin: 1%;
      }

      .answer-cell,
      .control-cell {
        display: block;
        width: 100%;
        margin-bottom: 10px;
      }

      button {
        min-height: 58px;
        font-size: 23px;
      }
    }

    @media screen and (orientation: landscape) and (max-height: 520px) {
      .page {
        padding: 8px;
      }

      .app {
        padding: 14px 18px;
      }

      h1,
      .subtitle {
        display: none;
      }

      .timer-wrap {
        margin-bottom: 10px;
      }

      .question-box {
        min-height: 102px;
        padding: 16px 10px;
        margin-bottom: 8px;
      }

      .question {
        font-size: 54px;
      }

      .status-row {
        margin-bottom: 6px;
      }

      .stat-card {
        padding: 7px 6px;
      }

      .stat-label {
        font-size: 12px;
      }

      .stat-value {
        font-size: 23px;
      }

      .hint {
        font-size: 14px;
        margin-bottom: 8px;
      }

      button {
        min-height: 50px;
        font-size: 21px;
        padding: 11px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="page-inner">
      <main class="app">
        <h1>算术判断任务</h1>
        <p class="subtitle">若 3 秒内未点击，自动切换下一题；点击“正确”或“错误”后，立即进入下一题。</p>

        <div class="timer-wrap">
          <div class="timer-bar" id="timerBar"></div>
        </div>

        <section class="question-box">
          <div class="question-inner">
            <div class="question" id="questionText">准备开始</div>
          </div>
        </section>

        <section class="status-row">
          <div class="stat-card">
            <div class="stat-label">总作答数</div>
            <div class="stat-value" id="totalCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">正确数</div>
            <div class="stat-value" id="correctCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">错误数</div>
            <div class="stat-value" id="wrongCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">正确率</div>
            <div class="stat-value" id="accuracy">0%</div>
          </div>
        </section>

        <div class="hint" id="hintText">请点击开始按钮</div>

        <section class="answer-row">
          <div class="answer-cell">
            <button type="button" class="btn-true" id="trueBtn" disabled>正确</button>
          </div>
          <div class="answer-cell">
            <button type="button" class="btn-false" id="falseBtn" disabled>错误</button>
          </div>
        </section>

        <section class="control-row">
          <div class="control-cell">
            <button type="button" class="btn-start" id="startBtn">开始</button>
          </div>
          <div class="control-cell">
            <button type="button" class="btn-end" id="endBtn" disabled>结束</button>
          </div>
          <div class="control-cell">
            <button type="button" class="btn-reset" id="resetBtn">清零</button>
          </div>
        </section>

        <p class="footer-note">加法结果不超过 100；减法结果不为负数。未作答题目不计入正确率。</p>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var QUESTION_INTERVAL = 3000;

      var running = false;
      var currentQuestion = null;
      var questionStartTime = 0;
      var total = 0;
      var correct = 0;
      var wrong = 0;
      var questionTimer = null;
      var progressTimer = null;
      var locked = false;

      var totalCount = document.getElementById("totalCount");
      var correctCount = document.getElementById("correctCount");
      var wrongCount = document.getElementById("wrongCount");
      var accuracy = document.getElementById("accuracy");
      var timerBar = document.getElementById("timerBar");
      var questionText = document.getElementById("questionText");
      var hintText = document.getElementById("hintText");
      var trueBtn = document.getElementById("trueBtn");
      var falseBtn = document.getElementById("falseBtn");
      var startBtn = document.getElementById("startBtn");
      var endBtn = document.getElementById("endBtn");
      var resetBtn = document.getElementById("resetBtn");

      function nowTime() {
        if (window.performance && window.performance.now) {
          return window.performance.now();
        }
        return new Date().getTime();
      }

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function generateQuestion() {
        var op = Math.random() < 0.5 ? "+" : "-";
        var a, b, realAnswer;

        if (op === "+") {
          a = randomInt(10, 90);
          b = randomInt(10, 100 - a);
          realAnswer = a + b;
        } else {
          a = randomInt(10, 99);
          b = randomInt(10, a);
          realAnswer = a - b;
        }

        var shouldBeCorrect = Math.random() < 0.5;
        var shownAnswer = realAnswer;

        if (!shouldBeCorrect) {
          var offset = randomInt(-9, 9);
          while (offset === 0) {
            offset = randomInt(-9, 9);
          }

          shownAnswer = realAnswer + offset;

          if (shownAnswer < 0 || shownAnswer > 100) {
            shownAnswer = realAnswer - offset;
          }

          if (shownAnswer === realAnswer) {
            shownAnswer = realAnswer === 100 ? 99 : realAnswer + 1;
          }
        }

        return {
          expression: String(a) + " " + op + " " + String(b) + " = " + String(shownAnswer),
          isEquationCorrect: shownAnswer === realAnswer
        };
      }

      function updateStats() {
        var rate = total === 0 ? 0 : Math.round((correct / total) * 100);
        totalCount.innerHTML = String(total);
        correctCount.innerHTML = String(correct);
        wrongCount.innerHTML = String(wrong);
        accuracy.innerHTML = String(rate) + "%";
      }

      function setAnswerButtonsEnabled(enabled) {
        trueBtn.disabled = !enabled;
        falseBtn.disabled = !enabled;
      }

      function clearTimers() {
        if (questionTimer) {
          clearTimeout(questionTimer);
          questionTimer = null;
        }
        if (progressTimer) {
          clearInterval(progressTimer);
          progressTimer = null;
        }
      }

      function showNextQuestion() {
        if (!running) {
          return;
        }

        clearTimers();
        locked = false;

        currentQuestion = generateQuestion();
        questionStartTime = nowTime();
        questionText.innerHTML = currentQuestion.expression;
        hintText.innerHTML = "请判断这个等式是否正确";
        timerBar.style.width = "100%";
        setAnswerButtonsEnabled(true);

        progressTimer = setInterval(function () {
          var elapsed = nowTime() - questionStartTime;
          var remainRatio = Math.max(0, 1 - elapsed / QUESTION_INTERVAL);
          timerBar.style.width = String(remainRatio * 100) + "%";
        }, 50);

        questionTimer = setTimeout(function () {
          if (running) {
            hintText.innerHTML = "未作答，已切换下一题";
            showNextQuestion();
          }
        }, QUESTION_INTERVAL);
      }

      function answer(userJudgment) {
        if (!running || !currentQuestion || locked) {
          return;
        }

        locked = true;
        setAnswerButtonsEnabled(false);

        if (userJudgment === currentQuestion.isEquationCorrect) {
          correct += 1;
        } else {
          wrong += 1;
        }

        total += 1;
        updateStats();

        showNextQuestion();
      }

      function startTask() {
        if (running) {
          return;
        }

        running = true;
        startBtn.disabled = true;
        endBtn.disabled = false;
        resetBtn.disabled = true;
        hintText.innerHTML = "任务进行中";
        showNextQuestion();
      }

      function endTask() {
        running = false;
        clearTimers();

        setAnswerButtonsEnabled(false);
        startBtn.disabled = false;
        endBtn.disabled = true;
        resetBtn.disabled = false;

        var rate = total === 0 ? 0 : Math.round((correct / total) * 100);
        questionText.innerHTML = "任务结束";
        hintText.innerHTML = "本轮共作答 " + total + " 题，正确 " + correct + " 题，错误 " + wrong + " 题，正确率 " + rate + "%";
        timerBar.style.width = "0%";
      }

      function resetTask() {
        running = false;
        clearTimers();

        currentQuestion = null;
        total = 0;
        correct = 0;
        wrong = 0;
        locked = false;

        updateStats();
        questionText.innerHTML = "准备开始";
        hintText.innerHTML = "请点击开始按钮";
        timerBar.style.width = "100%";
        setAnswerButtonsEnabled(false);
        startBtn.disabled = false;
        endBtn.disabled = true;
        resetBtn.disabled = false;
      }

      trueBtn.onclick = function () { answer(true); };
      falseBtn.onclick = function () { answer(false); };
      startBtn.onclick = function () { startTask(); };
      endBtn.onclick = function () { endTask(); };
      resetBtn.onclick = function () { resetTask(); };

      // 防止 iPhone / iPad Safari 双击缩放影响按钮点击
      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        var now = new Date().getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      updateStats();
    })();
  </script>
</body>
</html>
